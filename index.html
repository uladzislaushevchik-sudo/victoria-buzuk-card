<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виктория Бузук · Карточка ученика</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px;color:#666">Загрузка карточки…</p>
<script>
async function go() {
  const names = ['c0.txt', 'c1.txt', 'c2.txt', 'c3.txt', 'c4.txt', 'c5.txt'];
  const parts = await Promise.all(names.map(n => fetch(n).then(r => {
    if (!r.ok) throw new Error(n + ' HTTP ' + r.status);
    return r.text();
  })));
  const b64 = parts.join('').replace(/\s/g, '');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
}
go().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;text-align:center;color:#c62828;margin-top:40px">Ошибка: ' + e + '</p><p style="text-align:center;font-size:14px;color:#666">Открой локальный файл Victoria_Buzuk_Student_Card.html</p>';
});
</script>
</body>
</html>
